<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOSTOLD | Mapas de Accesibilidad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>HOSTOLD</h1>
    <p>Mapas de Accesibilidad ♿</p>
  </header>

  <main>
    <!-- Panel de Autenticación Unificado -->
    <section id="panelAuth" class="panel">
      <!-- Pestañas superiores para cambiar de modo -->
      <div class="pestanas-auth">
        <button id="tabLogin" class="tab-btn activa" type="button">Ingresar</button>
        <button id="tabRegistro" class="tab-btn" type="button">Registrarse</button>
      </div>
      
      <!-- FORMULARIO DE INICIO DE SESIÓN -->
      <div id="formLogin">
        <h2>Iniciar Sesión</h2>
        <label for="loginUsuario">Usuario</label>
        <input type="text" id="loginUsuario" placeholder="Ingrese su usuario">

        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" placeholder="Ingrese su contraseña">

        <button id="btnIngresar" type="button">Ingresar</button>
      </div>

      <!-- FORMULARIO DE REGISTRO (Oculto por defecto con hidden) -->
      <div id="formRegistro" hidden>
        <h2>Crear Cuenta</h2>
        <label for="regUsuario">Nuevo Usuario</label>
        <input type="text" id="regUsuario" placeholder="Cree un nombre de usuario">

        <label for="regPassword">Contraseña</label>
        <input type="password" id="regPassword" placeholder="Mínimo 4 caracteres">

        <label for="regConfirmarPassword">Confirmar Contraseña</label>
        <input type="password" id="regConfirmarPassword" placeholder="Repita la contraseña">

        <button id="btnRegistrar" type="button">Registrarse</button>
      </div>

      <!-- Mensajes de estado del Login/Registro -->
      <p id="mensajeAuth" role="status" class="error-login"></p>
    </section>

    <!-- Panel de Búsqueda de Mapas (Oculto por defecto) -->
    <section id="panelMapas" class="panel" hidden>
      <div class="header-panel-mapas">
        <h2>Buscar ubicación</h2>
        <button id="btnCerrarSesion" class="boton-logout" type="button">Salir</button>
      </div>

      <label for="region">Región</label>
      <select id="region">
        <option value="">Seleccione...</option>
      </select>

      <label for="provincia">Provincia</label>
      <select id="provincia" disabled>
        <option value="">Seleccione...</option>
      </select>

      <label for="distrito">Distrito</label>
      <select id="distrito" disabled>
        <option value="">Seleccione...</option>
      </select>

      <label for="lugar">Lugar</label>
      <select id="lugar" disabled>
        <option value="">Seleccione...</option>
      </select>

      <button id="guardar" type="button">
        Guardar ubicación
      </button>

      <p id="mensaje" role="status">
        Seleccione una ubicación.
      </p>
    </section>
  </main>

  <div id="visorMapa" class="visor-mapa" aria-hidden="true">
    <section class="visor-contenido" role="dialog"
      aria-modal="true" aria-label="Mapa del lugar">

      <button id="cerrarMapa" class="cerrar-mapa"
        type="button" aria-label="Cerrar mapa">×</button>

      <h2>Mapa de Accesibilidad</h2>

      <img id="imagenMapa" src="" alt="Mapa del lugar">

      <p id="errorImagen" class="error-imagen" hidden>
        No se pudo cargar el mapa. Comprueba el nombre del archivo.
      </p>

      <a id="descargarMapa" class="boton-descargar"
        href="#" download>
        Descargar mapa
      </a>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
